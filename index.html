<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#070b14" />
<title>Sara’s One Piece Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--abyss:#070b14;--navy:#0d1526;--surface:#152238;--gold:#e5b84b;--gold-l:#fae19c;--red:#d9383a;--teal:#2dd4bf;--text:#f1f5f9;--muted:#94a3b8;--line:rgba(229,184,75,.22);--shadow:0 20px 50px rgba(0,0,0,.75);--head:'Cinzel',Georgia,serif;--body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;color-scheme:dark}
body{background-color:var(--abyss);background-image:radial-gradient(circle at 12% 15%,rgba(229,184,75,.09),transparent 38%),radial-gradient(circle at 88% 82%,rgba(217,56,58,.07),transparent 42%);background-attachment:fixed;color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden}
body.theater{background-color:#020409;background-image:none}
body.theater .top-header{opacity:.2;transition:opacity .25s}
body.theater .top-header:hover{opacity:1}
button{font-family:inherit}

/* header */
.top-header{position:sticky;top:0;z-index:40;background:rgba(13,21,38,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1600px;margin:0 auto;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1.25rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.85rem;text-decoration:none;color:inherit}
.crest{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1e2f4d,#090f1d);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-title{font-family:var(--head);font-size:clamp(1.1rem,1.9vw,1.45rem);font-weight:800;letter-spacing:.05em;background:linear-gradient(90deg,#fff,var(--gold-l) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hud{display:flex;align-items:center;gap:1.1rem;background:rgba(7,11,20,.72);border:1px solid var(--line);border-radius:999px;padding:.4rem 1.1rem .4rem .6rem;flex:1;max-width:560px;min-width:270px}
.bounty{display:flex;align-items:center;gap:.5rem;background:rgba(229,184,75,.14);border:1px solid rgba(229,184,75,.4);border-radius:999px;padding:.32rem .8rem;flex-shrink:0;font-family:var(--head);font-weight:800;color:var(--gold-l);font-size:.92rem}
.bounty small{font-size:.62rem;letter-spacing:.1em;color:var(--gold)}
.track-wrap{flex:1;display:flex;align-items:center;gap:.7rem}
.track{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:999px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold),var(--teal));border-radius:999px;transition:width .45s ease;position:relative}
.ship{position:absolute;right:-11px;top:50%;transform:translateY(-58%);width:24px;height:24px}
.count{font-size:.76rem;font-weight:700;color:var(--gold-l);white-space:nowrap}
.header-actions{display:flex;gap:.55rem}
.btn-header,.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);color:var(--text);cursor:pointer;transition:all .16s;text-decoration:none;white-space:nowrap;user-select:none}
.btn-header{background:rgba(21,34,56,.75);color:var(--gold-l);padding:.5rem .9rem;border-radius:999px;font-size:.78rem;font-weight:600}
.btn{background:var(--surface);font-size:.8rem;font-weight:600;padding:.55rem .95rem;border-radius:8px}
.btn-header:hover,.btn:hover:not(:disabled){background:#1d2f4d;border-color:var(--gold)}
.btn:disabled,.btn-header:disabled{opacity:.35;cursor:not-allowed}
.btn-red{background:linear-gradient(135deg,var(--red),#a82022);border-color:rgba(250,225,156,.38)}
.btn.on{background:rgba(45,212,191,.16);border-color:var(--teal);color:var(--teal)}
.btn.lit{background:rgba(229,184,75,.22);border-color:var(--gold);color:var(--gold-l)}

/* layout */
.workspace{max-width:1600px;margin:0 auto;padding:1.35rem 1.5rem 2rem;display:grid;grid-template-columns:1fr 380px;gap:1.35rem;align-items:start}
body.theater .workspace{grid-template-columns:1fr;max-width:1360px}
body.theater .sidebar{display:none}
.stage{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.banner{background:linear-gradient(90deg,rgba(13,21,38,.95),rgba(21,34,56,.85));border:1px solid var(--line);border-radius:12px;padding:.85rem 1.2rem;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:1rem;position:relative;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--gold),var(--red))}
.banner-left{display:flex;align-items:center;gap:.85rem;min-width:0}
.badge{font-family:var(--head);font-size:.78rem;font-weight:800;color:var(--abyss);background:linear-gradient(135deg,var(--gold-l),var(--gold));padding:.3rem .7rem;border-radius:6px;flex-shrink:0}
.banner-text{min-width:0}
.banner-title{font-size:clamp(1.1rem,2vw,1.45rem);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner-saga{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.gem{font-size:.72rem;font-weight:700;padding:.28rem .7rem;border-radius:999px;flex-shrink:0}
.gem.done{background:rgba(45,212,191,.14);color:var(--teal);border:1px solid rgba(45,212,191,.4)}
.gem.todo{background:rgba(229,184,75,.12);color:var(--gold-l);border:1px solid rgba(229,184,75,.3)}
.player-shell{position:relative;width:100%;aspect-ratio:16/9;background:#03060c;border-radius:12px;border:1px solid rgba(229,184,75,.38);box-shadow:var(--shadow);overflow:hidden}
#player{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#player iframe,#player video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
.notice{position:relative;width:min(100%,520px);padding:1.5rem;text-align:center;color:var(--muted);font-size:.86rem;line-height:1.65}
.notice strong{display:block;color:var(--gold-l);font-size:1rem;margin-bottom:.5rem}
.notice code{background:rgba(255,255,255,.08);padding:.05rem .35rem;border-radius:4px;color:var(--text)}
.notice a{color:var(--gold);overflow-wrap:anywhere}
.deck{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;box-shadow:var(--shadow)}
.deck-group{display:flex;gap:.5rem;flex-wrap:wrap}

/* sidebar */
.sidebar{background:var(--navy);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.side-head{padding:.9rem 1.05rem;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}
.side-head h2{font-family:var(--head);font-size:1rem;color:var(--gold-l)}
.side-head span{font-size:.72rem;color:var(--muted)}
.filters{padding:.7rem .9rem;display:grid;grid-template-columns:1fr auto;gap:.5rem;background:rgba(7,11,20,.45);border-bottom:1px solid var(--line)}
.search,.select{background:var(--surface);border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:.8rem;padding:.5rem .65rem}
.search{width:100%}
.list{max-height:min(640px,70vh);overflow-y:auto;padding:.65rem;display:flex;flex-direction:column;gap:.4rem}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:rgba(229,184,75,.32);border-radius:999px}
.saga-label{font-family:var(--head);font-size:.72rem;letter-spacing:.08em;color:var(--gold);padding:.55rem .3rem .15rem}
.card{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.6rem .75rem;border-radius:9px;background:rgba(21,34,56,.5);border:1px solid transparent;transition:all .16s}
.card:hover{background:var(--surface);border-color:var(--line)}
.card.active{background:linear-gradient(90deg,rgba(229,184,75,.16),rgba(21,34,56,.9));border-color:var(--gold)}
.card-main{display:flex;align-items:center;gap:.6rem;min-width:0;flex:1;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:.15rem 0}
.num{font-family:var(--head);font-size:.74rem;font-weight:700;color:var(--gold);width:1.6rem;flex-shrink:0}
.name{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.64rem;font-weight:600;color:var(--muted);border:1px dashed rgba(148,163,184,.45);border-radius:999px;padding:.1rem .45rem;flex-shrink:0}
.card.nolink .name{color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:rgba(7,11,20,.55);color:var(--muted);cursor:pointer;flex-shrink:0;transition:all .15s}
.check:hover{border-color:var(--teal);color:var(--teal)}
.check.on{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.empty{padding:1.25rem .8rem;text-align:center;color:var(--muted);font-size:.85rem}
.toast{position:fixed;bottom:1.25rem;right:1.25rem;background:var(--navy);border:1px solid var(--gold);padding:.65rem 1rem;border-radius:10px;box-shadow:var(--shadow);font-size:.8rem;font-weight:600;z-index:90;opacity:0;transform:translateY(10px);pointer-events:none;transition:all .22s}
.toast.show{opacity:1;transform:none}
:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}

@media(max-width:1024px){.workspace{grid-template-columns:1fr}.hud{order:3;max-width:100%;width:100%}}
@media(max-width:680px){
.header-inner{padding:.75rem .9rem;gap:.75rem}.brand-title{font-size:1rem}.crest{width:40px;height:40px}
.hud{min-width:0;gap:.6rem}.header-actions{width:100%;justify-content:flex-end}
.workspace{padding:.8rem .7rem 1.5rem;gap:.9rem}
.banner{flex-wrap:wrap;padding:.8rem .9rem}.banner-title{white-space:normal}
.deck{padding:.7rem}.btn{padding:.5rem .65rem;font-size:.75rem}
.filters{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top-header">
  <div class="header-inner">
    <a href="#top" class="brand">
      <div class="crest" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="27" stroke="#e5b84b" stroke-width="2" stroke-dasharray="4 3" opacity=".7"/>
          <path d="M18 34C18 24.1 24.3 16 32 16C39.7 16 46 24.1 46 34H18Z" fill="#e5b84b"/>
          <path d="M18.3 30.5H45.7V34.5H18.3V30.5Z" fill="#d9383a"/>
          <ellipse cx="32" cy="35.5" rx="23" ry="4.5" fill="#fae19c" stroke="#e5b84b" stroke-width="1.5"/>
        </svg>
      </div>
      <h1 class="brand-title">Sara’s One Piece Journey</h1>
    </a>

    <div class="hud" aria-label="Bounty and voyage progress">
      <div class="bounty"><small>BOUNTY</small><span>฿ <span id="bounty">0</span></span></div>
      <div class="track-wrap">
        <div class="track">
          <div class="fill" id="fill">
            <svg class="ship" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <path d="M6 21L9 26H23L26 21H6Z" fill="#e5b84b"/>
              <path d="M16 5V21" stroke="#fae19c" stroke-width="2"/>
              <path d="M16 6C21 9 23 14 16 18Z" fill="#d9383a"/>
              <path d="M15 8C11 10 10 14 15 17Z" fill="#f1f5f9"/>
            </svg>
          </div>
        </div>
        <span class="count" id="count">0 / 0</span>
      </div>
    </div>

    <div class="header-actions">
      <a class="btn-header" id="drive-link" target="_blank" rel="noopener noreferrer">Drive folder</a>
      <button type="button" class="btn-header" id="btn-continue">Continue</button>
    </div>
  </div>
</header>

<main class="workspace" id="top">
  <section class="stage">
    <div class="banner">
      <div class="banner-left">
        <span class="badge" id="ep-badge">#01</span>
        <div class="banner-text">
          <h2 class="banner-title" id="ep-title"></h2>
          <p class="banner-saga" id="ep-saga"></p>
        </div>
      </div>
      <span class="gem todo" id="ep-status">⏳ Voyage</span>
    </div>

    <div class="player-shell"><div id="player"></div></div>

    <div class="deck">
      <div class="deck-group">
        <button type="button" class="btn" id="btn-prev">Prev</button>
        <button type="button" class="btn btn-red" id="btn-next">Next</button>
      </div>
      <div class="deck-group">
        <button type="button" class="btn" id="btn-watched">Mark watched</button>
        <button type="button" class="btn" id="btn-theater" aria-pressed="false">Lights off</button>
      </div>
    </div>
  </section>

  <aside class="sidebar" aria-label="Logbook">
    <div class="side-head"><h2>Grand Line Logbook</h2><span id="linked-count"></span></div>
    <div class="filters">
      <input type="search" id="search" class="search" placeholder="Search arcs…" autocomplete="off" aria-label="Search arcs" />
      <select id="filter" class="select" aria-label="Filter arcs">
        <option value="ALL">All</option>
        <option value="UNWATCHED">Unwatched</option>
        <option value="READY">Has link</option>
      </select>
    </div>
    <div class="list" id="list" role="list"></div>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   HOW TO ADD YOUR VIDEOS
   Paste a link between the quotes of `link` for any arc below.
   Accepted:
     • Google Drive FILE link  https://drive.google.com/file/d/FILE_ID/view
     • Just the Drive file ID  1AbCdEfGhIjKlMnOpQrStUvWxYz
     • A direct video URL      https://example.com/arc.mp4  (enables resume-where-you-left-off)
   A Drive FOLDER link will not work: open the video, Share → Copy link.
   Set each Drive video to "Anyone with the link – Viewer".
   ============================================================ */
const DRIVE_FOLDER_URL = "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing";

const ARCS = [
  // East Blue Saga
  { name: "Romance Dawn",        saga: "East Blue Saga",     link: "https://drive.google.com/file/d/1dEyIymR8FAJbxA5jsvytbkZVXut6LOSC/view?usp=drive_link" },
  { name: "Orange Town",         saga: "East Blue Saga",     link: "https://drive.google.com/file/d/1pGLcbx-eYya7uTFB5nK3P8Ih4BCGOn30/view?usp=drive_link" },
  { name: "Syrup Village",       saga: "East Blue Saga",     link: "https://drive.google.com/file/d/1HKbBCrE1Rcp5A9oWBQta8hkmD9_KgnrW/view?usp=drive_link" },
  { name: "Syrup Village part 2",       saga: "East Blue Saga",     link: "https://drive.google.com/file/d/1HKbBCrE1Rcp5A9oWBQta8hkmD9_KgnrW/view?usp=drive_link" },
  { name: "Baratie",             saga: "East Blue Saga",     link: "" },
  { name: "Arlong Park",         saga: "East Blue Saga",     link: "" },
  { name: "Loguetown",           saga: "East Blue Saga",     link: "" },
  // Arabasta Saga
  { name: "Reverse Mountain",    saga: "Arabasta Saga",      link: "" },
  { name: "Whisky Peak",         saga: "Arabasta Saga",      link: "" },
  { name: "Little Garden",       saga: "Arabasta Saga",      link: "" },
  { name: "Drum Island",         saga: "Arabasta Saga",      link: "" },
  { name: "Arabasta",            saga: "Arabasta Saga",      link: "" },
  // Sky Island Saga
  { name: "Jaya",                saga: "Sky Island Saga",    link: "" },
  { name: "Skypiea",             saga: "Sky Island Saga",    link: "" },
  // Water 7 Saga
  { name: "Long Ring Long Land", saga: "Water 7 Saga",       link: "" },
  { name: "Water 7",             saga: "Water 7 Saga",       link: "" },
  { name: "Enies Lobby",         saga: "Water 7 Saga",       link: "" },
  { name: "Post-Enies Lobby",    saga: "Water 7 Saga",       link: "" },
  // Thriller Bark Saga
  { name: "Thriller Bark",       saga: "Thriller Bark Saga", link: "" },
  // Summit War Saga
  { name: "Sabaody Archipelago", saga: "Summit War Saga",    link: "" },
  { name: "Amazon Lily",         saga: "Summit War Saga",    link: "" }
  // To add more: copy a line above, e.g. { name: "Impel Down", saga: "Summit War Saga", link: "" }
].map((arc, i) => ({ ...arc, id: i + 1 }));

const KEYS = { watched: "sara_op_watched_v6", last: "sara_op_last_ep_v6", pos: "sara_op_positions_v1" };
const BERRY_PER_ARC = 1500000;
const SAVE_EVERY = 5;

const state = { current: ARCS[0].id, watched: new Set(), positions: {}, query: "", filter: "ALL", theater: false };
const $ = id => document.getElementById(id);
const dom = {
  bounty: $("bounty"), count: $("count"), fill: $("fill"), linked: $("linked-count"),
  badge: $("ep-badge"), title: $("ep-title"), saga: $("ep-saga"), status: $("ep-status"),
  player: $("player"), prev: $("btn-prev"), next: $("btn-next"), watched: $("btn-watched"),
  theater: $("btn-theater"), cont: $("btn-continue"), search: $("search"), filter: $("filter"),
  list: $("list"), toast: $("toast")
};
$("drive-link").href = DRIVE_FOLDER_URL;

/* ---------- storage ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function loadState() {
  try {
    const w = JSON.parse(store.get(KEYS.watched) || "[]");
    const valid = new Set(ARCS.map(a => a.id));
    if (Array.isArray(w)) state.watched = new Set(w.filter(id => valid.has(id)));
  } catch (e) {}
  const last = Number(store.get(KEYS.last));
  if (ARCS.some(a => a.id === last)) state.current = last;
  try {
    const p = JSON.parse(store.get(KEYS.pos) || "{}");
    if (p && typeof p === "object" && !Array.isArray(p)) state.positions = p;
  } catch (e) {}
}
const saveWatched = () => store.set(KEYS.watched, JSON.stringify([...state.watched]));
const savePositions = () => store.set(KEYS.pos, JSON.stringify(state.positions));

/* ---------- helpers ---------- */
let toastTimer;
function toast(msg) {
  dom.toast.textContent = msg;
  dom.toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => dom.toast.classList.remove("show"), 2600);
}
const idx = () => ARCS.findIndex(a => a.id === state.current);
const cur = () => ARCS[idx()] || ARCS[0];

function parseLink(raw) {
  const v = (raw || "").trim();
  if (!v) return { type: "none" };
  if (/^[\w-]{20,}$/.test(v)) return { type: "drive", id: v };
  let u;
  try { u = new URL(v); } catch (e) { return { type: "invalid" }; }
  if (u.protocol !== "https:" && u.protocol !== "http:") return { type: "invalid" };
  if (/(^|\.)drive\.google\.com$/i.test(u.hostname)) {
    if (u.pathname.includes("/folders/")) return { type: "folder" };
    const id = (u.pathname.match(/\/file\/d\/([^/]+)/) || [])[1] || u.searchParams.get("id");
    return id ? { type: "drive", id } : { type: "invalid" };
  }
  return { type: "direct", url: u.href };
}
const hasLink = arc => ["drive", "direct"].includes(parseLink(arc.link).type);

/* ---------- player ---------- */
function notice(heading, html) {
  const wrap = document.createElement("div");
  wrap.className = "notice";
  const h = document.createElement("strong");
  h.textContent = heading;
  const p = document.createElement("p");
  p.innerHTML = html;
  wrap.append(h, p);
  dom.player.replaceChildren(wrap);
}

function mountPlayer(arc, startOver) {
  dom.player.replaceChildren();
  const info = parseLink(arc.link);

  if (info.type === "direct") {
    const video = document.createElement("video");
    Object.assign(video, { controls: true, autoplay: false, playsInline: true, preload: "metadata", src: info.url });
    video.setAttribute("aria-label", arc.name);
    let lastSaved = -SAVE_EVERY;
    video.addEventListener("loadedmetadata", () => {
      const at = Number(state.positions[arc.id] || 0);
      if (!startOver && at > 3 && at < video.duration - 3) { video.currentTime = at; toast("Picked up where you left off"); }
    });
    video.addEventListener("timeupdate", () => {
      const s = Math.floor(video.currentTime);
      if (s - lastSaved >= SAVE_EVERY) { state.positions[arc.id] = s; savePositions(); lastSaved = s; }
    });
    video.addEventListener("ended", () => { state.positions[arc.id] = 0; savePositions(); });
    video.addEventListener("error", () => notice("This video can’t be played", "Check that the link goes straight to a video file (like <code>.mp4</code>) and that the host allows playback from this page."));
    dom.player.appendChild(video);
    return;
  }

  if (info.type === "drive") {
    const frame = document.createElement("iframe");
    frame.src = `https://drive.google.com/file/d/${encodeURIComponent(info.id)}/preview`;
    frame.title = `Google Drive video: ${arc.name}`;
    frame.allow = "autoplay; fullscreen; picture-in-picture";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "no-referrer-when-downgrade";
    dom.player.appendChild(frame);
    return;
  }

  const folder = `<a href="${DRIVE_FOLDER_URL}" target="_blank" rel="noopener noreferrer">Open Drive folder</a>`;
  if (info.type === "folder") {
    notice("That’s a folder link", `Arc ${arc.id} needs a link to the video itself. Open the video in Drive, choose Share, copy the link (it contains <code>/file/d/</code>) and paste it into <code>link</code>.<br><br>${folder}`);
  } else if (info.type === "invalid") {
    notice("That link isn’t recognised", `Use a Drive file link, a Drive file ID, or a direct video URL in the <code>link</code> field for “${arc.name}”.`);
  } else {
    notice(`No video for “${arc.name}” yet`, `Paste its link into the ARCS list in this file: find <code>${arc.name}</code> and put the link between the quotes of <code>link</code>.<br><br>${folder}`);
  }
}

/* ---------- UI ---------- */
function updateUI() {
  const total = ARCS.length;
  const done = ARCS.filter(a => state.watched.has(a.id)).length;
  dom.bounty.textContent = (done * BERRY_PER_ARC).toLocaleString("en-US");
  dom.count.textContent = `${done} / ${total}`;
  dom.fill.style.width = `${Math.round((done / total) * 100)}%`;
  dom.linked.textContent = `${ARCS.filter(hasLink).length}/${total} linked`;

  const i = idx(), arc = cur(), isDone = state.watched.has(arc.id);
  dom.badge.textContent = `#${String(i + 1).padStart(2, "0")}`;
  dom.title.textContent = arc.name;
  dom.saga.textContent = arc.saga;
  dom.status.textContent = isDone ? "✔ Completed" : "⏳ Voyage";
  dom.status.className = `gem ${isDone ? "done" : "todo"}`;
  dom.watched.classList.toggle("on", isDone);
  dom.watched.textContent = isDone ? "Completed ✔" : "Mark watched";
  dom.prev.disabled = i <= 0;
  dom.next.disabled = i >= total - 1;
}

function toggleWatched(arc) {
  if (state.watched.has(arc.id)) { state.watched.delete(arc.id); toast("Arc marked as unwatched"); }
  else { state.watched.add(arc.id); toast("+฿ 1,500,000 bounty added!"); }
  saveWatched(); updateUI(); renderList();
}

function selectArc(arc, startOver) {
  state.current = arc.id;
  store.set(KEYS.last, String(arc.id));
  updateUI(); renderList(); mountPlayer(arc, startOver);
}

function renderList() {
  dom.list.replaceChildren();
  const q = state.query.trim().toLowerCase();
  let shown = 0, lastSaga = "";

  ARCS.forEach(arc => {
    const isDone = state.watched.has(arc.id), linked = hasLink(arc);
    if (q && !`${arc.name} ${arc.saga}`.toLowerCase().includes(q)) return;
    if (state.filter === "UNWATCHED" && isDone) return;
    if (state.filter === "READY" && !linked) return;
    shown++;

    if (arc.saga !== lastSaga) {
      lastSaga = arc.saga;
      const label = document.createElement("div");
      label.className = "saga-label";
      label.textContent = arc.saga;
      dom.list.appendChild(label);
    }

    const card = document.createElement("div");
    card.className = `card${arc.id === state.current ? " active" : ""}${linked ? "" : " nolink"}`;
    card.setAttribute("role", "listitem");

    const main = document.createElement("button");
    main.type = "button";
    main.className = "card-main";
    if (arc.id === state.current) main.setAttribute("aria-current", "true");
    const num = Object.assign(document.createElement("span"), { className: "num", textContent: String(arc.id).padStart(2, "0") });
    const name = Object.assign(document.createElement("span"), { className: "name", textContent: arc.name });
    main.append(num, name);
    if (!linked) main.appendChild(Object.assign(document.createElement("span"), { className: "tag", textContent: "no link" }));
    main.addEventListener("click", () => selectArc(arc));

    const check = document.createElement("button");
    check.type = "button";
    check.className = `check${isDone ? " on" : ""}`;
    check.textContent = isDone ? "✓" : "○";
    check.setAttribute("aria-label", `${isDone ? "Mark unwatched" : "Mark watched"}: ${arc.name}`);
    check.addEventListener("click", () => toggleWatched(arc));

    card.append(main, check);
    dom.list.appendChild(card);
  });

  if (!shown) dom.list.appendChild(Object.assign(document.createElement("div"), { className: "empty", textContent: "No arcs match your search or filter." }));
}

/* ---------- events ---------- */
const move = d => { const n = ARCS[idx() + d]; if (n) selectArc(n); };
dom.prev.addEventListener("click", () => move(-1));
dom.next.addEventListener("click", () => move(1));
dom.watched.addEventListener("click", () => toggleWatched(cur()));

dom.theater.addEventListener("click", () => {
  state.theater = !state.theater;
  document.body.classList.toggle("theater", state.theater);
  dom.theater.classList.toggle("lit", state.theater);
  dom.theater.textContent = state.theater ? "Lights on" : "Lights off";
  dom.theater.setAttribute("aria-pressed", String(state.theater));
});

dom.search.addEventListener("input", e => { state.query = e.target.value; renderList(); });
dom.filter.addEventListener("change", e => { state.filter = e.target.value; renderList(); });

dom.cont.addEventListener("click", () => {
  const next = ARCS.find(a => !state.watched.has(a.id) && hasLink(a));
  if (next) selectArc(next);
  else toast(ARCS.some(hasLink) ? "All linked arcs are watched" : "Add a video link first");
});

/* ---------- start ---------- */
loadState();
updateUI();
renderList();
mountPlayer(cur());
</script>
</body>
</html>

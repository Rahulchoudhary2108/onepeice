<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <title>Sara's One Piece Journey</title>

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-abyss: #070b14;
      --bg-navy: #0d1526;
      --bg-surface: #152238;
      --bg-glass: rgba(13, 21, 38, 0.86);
      --gold-primary: #e5b84b;
      --gold-light: #fae19c;
      --crimson-accent: #d9383a;
      --sea-teal: #2dd4bf;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-subtle: rgba(229, 184, 75, 0.22);
      --shadow-elevation: 0 20px 50px rgba(0, 0, 0, 0.75);
      --font-heading: 'Cinzel', Georgia, serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg-abyss);
      background-image:
        radial-gradient(circle at 12% 15%, rgba(229, 184, 75, 0.09) 0%, transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(217, 56, 58, 0.07) 0%, transparent 42%),
        linear-gradient(rgba(229, 184, 75, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(229, 184, 75, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 56px 56px, 56px 56px;
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .nautical-watermark {
      position: fixed;
      right: -120px;
      bottom: -120px;
      width: 520px;
      height: 520px;
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }

    body.theater-mode {
      background-color: #020409;
      background-image: none;
    }
    body.theater-mode .top-header {
      opacity: 0.2;
      transition: opacity 0.25s ease;
    }
    body.theater-mode .top-header:hover {
      opacity: 1;
    }

    /* HEADER */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-crest {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e2f4d, #090f1d);
      border: 1.5px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(229, 184, 75, 0.22);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: clamp(1.15rem, 1.9vw, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #ffffff 0%, var(--gold-light) 60%, var(--gold-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* HUD */
    .grand-line-hud {
      display: flex;
      align-items: center;
      gap: 1.15rem;
      background: rgba(7, 11, 20, 0.72);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 0.4rem 1.15rem 0.4rem 0.6rem;
      flex: 1;
      max-width: 560px;
      min-width: 270px;
    }

    .wanted-plaque {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, rgba(229, 184, 75, 0.2), rgba(229, 184, 75, 0.05));
      border: 1px solid rgba(229, 184, 75, 0.4);
      border-radius: 999px;
      padding: 0.32rem 0.8rem;
      flex-shrink: 0;
    }

    .wanted-tag {
      font-family: var(--font-heading);
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--gold-primary);
    }

    .bounty-value {
      font-family: var(--font-heading);
      font-size: 0.96rem;
      font-weight: 800;
      color: var(--gold-light);
    }

    .voyage-track-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .sea-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 999px;
      position: relative;
    }

    .sea-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--crimson-accent), var(--gold-primary), var(--sea-teal));
      border-radius: 999px;
      transition: width 0.45s ease;
      position: relative;
    }

    .ship-marker {
      position: absolute;
      right: -11px;
      top: 50%;
      transform: translateY(-58%);
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
    }

    .voyage-count-pill {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--gold-light);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(21, 34, 56, 0.75);
      color: var(--gold-light);
      border: 1px solid var(--border-subtle);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-header:hover {
      background: rgba(229, 184, 75, 0.2);
      border-color: var(--gold-primary);
    }

    /* WORKSPACE */
    .workspace {
      position: relative;
      z-index: 1;
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.35rem 1.5rem 2rem;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 1.35rem;
      align-items: start;
    }

    body.theater-mode .workspace {
      grid-template-columns: 1fr;
      max-width: 1360px;
    }
    body.theater-mode .playlist-sidebar {
      display: none;
    }

    .theater-stage {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      min-width: 0;
    }

    .episode-banner {
      background: linear-gradient(90deg, rgba(13, 21, 38, 0.95) 0%, rgba(21, 34, 56, 0.85) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      box-shadow: var(--shadow-elevation);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }
    .episode-banner::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--gold-primary), var(--crimson-accent));
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      min-width: 0;
    }

    .ep-crest-pill {
      font-family: var(--font-heading);
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--bg-abyss);
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    .banner-title {
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-gem {
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .status-gem.is-completed {
      background: rgba(45, 212, 191, 0.14);
      color: var(--sea-teal);
      border: 1px solid rgba(45, 212, 191, 0.4);
    }
    .status-gem.is-voyage {
      background: rgba(229, 184, 75, 0.12);
      color: var(--gold-light);
      border: 1px solid rgba(229, 184, 75, 0.3);
    }

    /* PLAYER CONTAINER */
    .player-frame-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #03060c;
      border-radius: 12px;
      border: 1px solid rgba(229, 184, 75, 0.38);
      box-shadow: var(--shadow-elevation);
      overflow: hidden;
    }

    .brass-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--gold-primary);
      border-style: solid;
      z-index: 3;
      pointer-events: none;
      opacity: 0.75;
    }
    .brass-corner.tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; border-top-left-radius: 4px; }
    .brass-corner.bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; border-bottom-left-radius: 4px; }
    .brass-corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; border-bottom-right-radius: 4px; }

    #player-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #player-viewport video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .player-notice {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      max-width: 400px;
    }
    .player-notice a {
      color: var(--gold-primary);
      text-decoration: underline;
    }

    /* CONTROL DECK */
    .control-deck {
      background: var(--bg-navy);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.75rem 1.05rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      box-shadow: var(--shadow-elevation);
    }

    .deck-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
    }
    .btn:hover:not(:disabled) {
      background: #1d2f4d;
      border-color: var(--gold-primary);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn-crimson {
      background: linear-gradient(135deg, var(--crimson-accent), #a82022);
      border-color: rgba(250, 225, 156, 0.38);
      color: #fff;
    }
    .btn-watched.is-watched {
      background: rgba(45, 212, 191, 0.16);
      border-color: var(--sea-teal);
      color: var(--sea-teal);
    }
    .btn-theater.is-active {
      background: rgba(229, 184, 75, 0.22);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    /* SIDEBAR */
    .playlist-sidebar {
      background: var(--bg-navy);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: var(--shadow-elevation);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 0.9rem 1.05rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title-wrap h2 {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--gold-light);
    }

    .sidebar-filters {
      padding: 0.7rem 0.9rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      background: rgba(7, 11, 20, 0.45);
      border-bottom: 1px solid var(--border-subtle);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-box svg {
      position: absolute;
      left: 0.65rem;
      color: var(--text-secondary);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      color: var(--text-primary);
      font-size: 0.8rem;
      padding: 0.48rem 0.65rem 0.48rem 2rem;
    }
    .search-input:focus, .filter-select:focus {
      outline: none;
      border-color: var(--gold-primary);
    }
    .filter-select {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      color: var(--text-primary);
      font-size: 0.78rem;
      padding: 0.48rem 0.55rem;
      cursor: pointer;
    }

    .episode-list {
      max-height: 600px;
      overflow-y: auto;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .episode-list::-webkit-scrollbar {
      width: 6px;
    }
    .episode-list::-webkit-scrollbar-thumb {
      background: rgba(229, 184, 75, 0.32);
      border-radius: 999px;
    }

    .ep-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.7rem 0.85rem;
      border-radius: 9px;
      background: rgba(21, 34, 56, 0.5);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .ep-card:hover {
      background: var(--bg-surface);
      border-color: var(--border-subtle);
    }
    .ep-card.is-active {
      background: linear-gradient(90deg, rgba(229, 184, 75, 0.16), rgba(21, 34, 56, 0.9));
      border-color: var(--gold-primary);
      box-shadow: 0 0 18px rgba(229, 184, 75, 0.14);
    }

    .ep-card-main {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      flex: 1;
    }
    .compass-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(229, 184, 75, 0.35);
      flex-shrink: 0;
    }
    .ep-card.is-active .compass-dot {
      background: var(--gold-primary);
      box-shadow: 0 0 8px var(--gold-primary);
    }
    .ep-name-text {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ep-watch-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: rgba(7, 11, 20, 0.55);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .ep-watch-btn:hover {
      border-color: var(--sea-teal);
      color: var(--sea-teal);
    }
    .ep-watch-btn.is-watched {
      background: rgba(45, 212, 191, 0.18);
      border-color: var(--sea-teal);
      color: var(--sea-teal);
    }

    .toast {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: var(--bg-navy);
      border: 1px solid var(--gold-primary);
      color: var(--text-primary);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      box-shadow: var(--shadow-elevation);
      font-size: 0.8rem;
      font-weight: 600;
      z-index: 90;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.22s ease;
    }
    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1024px) {
      .workspace { grid-template-columns: 1fr; }
      .grand-line-hud { order: 3; max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>

  <svg class="nautical-watermark" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="100" cy="100" r="90" stroke="#e5b84b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="100" cy="100" r="70" stroke="#e5b84b" stroke-width="1"/>
    <polygon points="100,8 112,88 100,76 88,88" fill="#e5b84b"/>
    <polygon points="100,192 112,112 100,124 88,112" fill="#e5b84b"/>
    <polygon points="8,100 88,88 76,100 88,112" fill="#e5b84b"/>
    <polygon points="192,100 112,88 124,100 112,112" fill="#e5b84b"/>
  </svg>

  <header class="top-header">
    <div class="header-inner">
      <a href="#top" class="brand-group">
        <div class="brand-crest" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="27" stroke="#e5b84b" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
            <path d="M18 34C18 24.1 24.3 16 32 16C39.7 16 46 24.1 46 34H18Z" fill="#e5b84b"/>
            <path d="M18.3 30.5H45.7V34.5H18.3V30.5Z" fill="#d9383a"/>
            <ellipse cx="32" cy="35.5" rx="23" ry="4.5" fill="#fae19c" stroke="#e5b84b" stroke-width="1.5"/>
          </svg>
        </div>
        <h1 class="brand-title">Sara's One Piece Journey</h1>
      </a>

      <div class="grand-line-hud" aria-label="Bounty and Voyage Progress">
        <div class="wanted-plaque">
          <span class="wanted-tag">BOUNTY</span>
          <span class="bounty-value">฿ <span id="bounty-counter">0</span></span>
        </div>
        <div class="voyage-track-wrap">
          <div class="sea-track">
            <div class="sea-fill" id="progress-fill-bar">
              <svg class="ship-marker" viewBox="0 0 32 32" fill="none">
                <path d="M6 21L9 26H23L26 21H6Z" fill="#e5b84b"/>
                <path d="M16 5V21" stroke="#fae19c" stroke-width="2"/>
                <path d="M16 6C21 9 23 14 16 18Z" fill="#d9383a"/>
                <path d="M15 8C11 10 10 14 15 17Z" fill="#f1f5f9"/>
              </svg>
            </div>
          </div>
          <span class="voyage-count-pill" id="progress-count-text">0 / 0</span>
        </div>
      </div>

      <div class="header-actions">
        <a href="https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn-header">
          <span>Drive Folder</span>
        </a>
        <button type="button" class="btn-header" id="btn-resume-last">
          <span>Resume</span>
        </button>
      </div>
    </div>
  </header>

  <main class="workspace" id="top">
    <section class="theater-stage">
      <div class="episode-banner">
        <div class="banner-left">
          <span class="ep-crest-pill" id="banner-ep-badge">#01</span>
          <h2 class="banner-title" id="banner-ep-title">Ark 1.mp4</h2>
        </div>
        <span class="status-gem is-voyage" id="banner-status-badge">⏳ VOYAGE</span>
      </div>

      <div class="player-frame-shell">
        <span class="brass-corner tl"></span>
        <span class="brass-corner bl"></span>
        <span class="brass-corner br"></span>
        <div id="player-viewport"></div>
      </div>

      <div class="control-deck">
        <div class="deck-group">
          <button type="button" class="btn" id="btn-prev-ep">Prev</button>
          <button type="button" class="btn btn-crimson" id="btn-next-ep">Next</button>
        </div>
        <div class="deck-group">
          <button type="button" class="btn btn-watched" id="btn-mark-watched">
            <span id="watched-btn-text">Watched</span>
          </button>
          <button type="button" class="btn btn-theater" id="btn-theater-mode">
            <span id="theater-btn-text">Lights Off</span>
          </button>
        </div>
      </div>
    </section>

    <aside class="playlist-sidebar" aria-label="Logbook">
      <div class="sidebar-header">
        <div class="sidebar-title-wrap">
          <h2>Grand Line Logbook</h2>
        </div>
      </div>

      <div class="sidebar-filters">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="search-input" class="search-input" placeholder="Search files..." autocomplete="off"/>
        </div>
        <select id="filter-select" class="filter-select">
          <option value="ALL">All</option>
          <option value="UNWATCHED">Unwatched</option>
        </select>
      </div>

      <div class="episode-list" id="episode-list-container" role="list"></div>
    </aside>
  </main>

  <div class="toast" id="app-toast" role="status" aria-live="polite"></div>

  <script>
    /* ============================================================================
       EPISODE LIST 
       To avoid Google Drive's "No preview available" screen, replace `directVideoUrl` 
       with a direct hosting link (or an mp4 link) once your file is ready.
       ============================================================================ */
    const EPISODES = [
      {
        id: 1,
        title: "Ark 1.mp4",
        directVideoUrl: "" // Put direct .mp4 or direct video stream URL here
      }
    ];

    const STORAGE_KEYS = {
      WATCHED: "sara_op_watched_v5",
      LAST_EPISODE: "sara_op_last_ep_v5"
    };

    const BERRY_PER_EPISODE = 1500000;

    let state = {
      currentEpisodeId: EPISODES[0].id,
      watchedIds: new Set(),
      searchQuery: "",
      filterStatus: "ALL",
      theaterMode: false
    };

    const dom = {
      bountyCounter: document.getElementById("bounty-counter"),
      progressCountText: document.getElementById("progress-count-text"),
      progressFillBar: document.getElementById("progress-fill-bar"),
      btnResumeLast: document.getElementById("btn-resume-last"),
      bannerEpBadge: document.getElementById("banner-ep-badge"),
      bannerEpTitle: document.getElementById("banner-ep-title"),
      bannerStatusBadge: document.getElementById("banner-status-badge"),
      playerViewport: document.getElementById("player-viewport"),
      btnPrevEp: document.getElementById("btn-prev-ep"),
      btnNextEp: document.getElementById("btn-next-ep"),
      btnMarkWatched: document.getElementById("btn-mark-watched"),
      watchedBtnText: document.getElementById("watched-btn-text"),
      btnTheaterMode: document.getElementById("btn-theater-mode"),
      theaterBtnText: document.getElementById("theater-btn-text"),
      searchInput: document.getElementById("search-input"),
      filterSelect: document.getElementById("filter-select"),
      episodeListContainer: document.getElementById("episode-list-container"),
      appToast: document.getElementById("app-toast")
    };

    function loadSavedState() {
      try {
        const rawWatched = localStorage.getItem(STORAGE_KEYS.WATCHED);
        if (rawWatched) state.watchedIds = new Set(JSON.parse(rawWatched));
        const savedId = localStorage.getItem(STORAGE_KEYS.LAST_EPISODE);
        if (savedId && EPISODES.some(e => e.id === Number(savedId))) {
          state.currentEpisodeId = Number(savedId);
        }
      } catch (e) {}
    }

    function showToast(msg) {
      dom.appToast.textContent = msg;
      dom.appToast.classList.add("is-visible");
      setTimeout(() => dom.appToast.classList.remove("is-visible"), 2600);
    }

    function mountPlayer(episode) {
      dom.playerViewport.innerHTML = "";

      if (!episode.directVideoUrl) {
        dom.playerViewport.innerHTML = `
          <div class="player-notice">
            <p>Google Drive blocks direct browser playback until the file is fully processed or converted.</p>
            <br>
            <a href="https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing" target="_blank">Open Drive Folder in New Tab</a>
          </div>
        `;
        return;
      }

      const video = document.createElement("video");
      video.controls = true;
      video.autoplay = false;
      video.src = episode.directVideoUrl;
      dom.playerViewport.appendChild(video);
    }

    function updateUI() {
      const total = EPISODES.length;
      const watchedCount = EPISODES.filter(e => state.watchedIds.has(e.id)).length;
      const pct = total > 0 ? Math.round((watchedCount / total) * 100) : 0;

      dom.bountyCounter.textContent = (watchedCount * BERRY_PER_EPISODE).toLocaleString("en-US");
      dom.progressCountText.textContent = `${watchedCount} / ${total}`;
      dom.progressFillBar.style.width = `${pct}%`;

      const idx = EPISODES.findIndex(e => e.id === state.currentEpisodeId);
      const ep = EPISODES[idx] || EPISODES[0];

      dom.bannerEpBadge.textContent = `#${String(idx + 1).padStart(2, "0")}`;
      dom.bannerEpTitle.textContent = ep.title;

      const isWatched = state.watchedIds.has(ep.id);
      if (isWatched) {
        dom.bannerStatusBadge.textContent = "✔ COMPLETED";
        dom.bannerStatusBadge.className = "status-gem is-completed";
        dom.btnMarkWatched.classList.add("is-watched");
        dom.watchedBtnText.textContent = "Completed ✔";
      } else {
        dom.bannerStatusBadge.textContent = "⏳ VOYAGE";
        dom.bannerStatusBadge.className = "status-gem is-voyage";
        dom.btnMarkWatched.classList.remove("is-watched");
        dom.watchedBtnText.textContent = "Watched";
      }

      dom.btnPrevEp.disabled = idx <= 0;
      dom.btnNextEp.disabled = idx >= EPISODES.length - 1;
    }

    function renderSidebar() {
      dom.episodeListContainer.innerHTML = "";
      const q = state.searchQuery.toLowerCase();

      EPISODES.forEach((ep) => {
        if (q && !ep.title.toLowerCase().includes(q)) return;
        const isWatched = state.watchedIds.has(ep.id);
        if (state.filterStatus === "UNWATCHED" && isWatched) return;

        const isActive = ep.id === state.currentEpisodeId;
        const card = document.createElement("div");
        card.className = `ep-card${isActive ? " is-active" : ""}`;

        card.innerHTML = `
          <div class="ep-card-main">
            <span class="compass-dot"></span>
            <span class="ep-name-text">${ep.title}</span>
          </div>
          <button type="button" class="ep-watch-btn${isWatched ? " is-watched" : ""}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
        `;

        card.querySelector(".ep-watch-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          if (state.watchedIds.has(ep.id)) {
            state.watchedIds.delete(ep.id);
          } else {
            state.watchedIds.add(ep.id);
            showToast("+฿ 1,500,000 Bounty Added!");
          }
          localStorage.setItem(STORAGE_KEYS.WATCHED, JSON.stringify(Array.from(state.watchedIds)));
          updateUI();
          renderSidebar();
        });

        card.addEventListener("click", () => {
          state.currentEpisodeId = ep.id;
          localStorage.setItem(STORAGE_KEYS.LAST_EPISODE, ep.id);
          updateUI();
          renderSidebar();
          mountPlayer(ep);
        });

        dom.episodeListContainer.appendChild(card);
      });
    }

    dom.btnPrevEp.addEventListener("click", () => {
      const idx = EPISODES.findIndex(e => e.id === state.currentEpisodeId);
      if (idx > 0) {
        state.currentEpisodeId = EPISODES[idx - 1].id;
        updateUI();
        renderSidebar();
        mountPlayer(EPISODES[idx - 1]);
      }
    });

    dom.btnNextEp.addEventListener("click", () => {
      const idx = EPISODES.findIndex(e => e.id === state.currentEpisodeId);
      if (idx >= 0 && idx < EPISODES.length - 1) {
        state.currentEpisodeId = EPISODES[idx + 1].id;
        updateUI();
        renderSidebar();
        mountPlayer(EPISODES[idx + 1]);
      }
    });

    dom.btnMarkWatched.addEventListener("click", () => {
      const ep = EPISODES.find(e => e.id === state.currentEpisodeId);
      if (!ep) return;
      if (state.watchedIds.has(ep.id)) {
        state.watchedIds.delete(ep.id);
      } else {
        state.watchedIds.add(ep.id);
        showToast("+฿ 1,500,000 Bounty Added!");
      }
      localStorage.setItem(STORAGE_KEYS.WATCHED, JSON.stringify(Array.from(state.watchedIds)));
      updateUI();
      renderSidebar();
    });

    dom.btnTheaterMode.addEventListener("click", () => {
      state.theaterMode = !state.theaterMode;
      document.body.classList.toggle("theater-mode", state.theaterMode);
      dom.btnTheaterMode.classList.toggle("is-active", state.theaterMode);
      dom.theaterBtnText.textContent = state.theaterMode ? "Lights On" : "Lights Off";
    });

    dom.searchInput.addEventListener("input", (e) => {
      state.searchQuery = e.target.value;
      renderSidebar();
    });

    dom.filterSelect.addEventListener("change", (e) => {
      state.filterStatus = e.target.value;
      renderSidebar();
    });

    dom.btnResumeLast.addEventListener("click", () => {
      const ep = EPISODES.find(e => e.id === state.currentEpisodeId) || EPISODES[0];
      mountPlayer(ep);
    });

    loadSavedState();
    updateUI();
    renderSidebar();
    mountPlayer(EPISODES.find(e => e.id === state.currentEpisodeId) || EPISODES[0]);
  </script>
</body>
</html>

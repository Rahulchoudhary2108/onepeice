<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b14" />
  <title>Sara's One Piece Journey</title>

  <!-- 1. DNS & SOCKET PRE-WARMING FOR GOOGLE DRIVE STREAMING -->
  <link rel="preconnect" href="https://drive.google.com" crossorigin>
  <link rel="preconnect" href="https://www.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://drive.google.com">
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
  <link rel="dns-prefetch" href="https://docs.google.com">

  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       2. VISUAL DESIGN SYSTEM ("GRAND LINE PIRATE LOGBOOK" THEME)
       ========================================================================== */
    :root {
      --bg-abyss: #070b14;
      --bg-navy: #0d1526;
      --bg-surface: #152238;
      --bg-glass: rgba(13, 21, 38, 0.85);
      --gold-primary: #e5b84b;
      --gold-light: #fae19c;
      --crimson-accent: #d9383a;
      --sea-teal: #2dd4bf;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-subtle: rgba(229, 184, 75, 0.22);
      --shadow-elevation: 0 20px 50px rgba(0, 0, 0, 0.7);
      --font-heading: 'Cinzel', Georgia, serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg-abyss);
      background-image:
        radial-gradient(circle at 14% 12%, rgba(229, 184, 75, 0.09) 0%, transparent 38%),
        radial-gradient(circle at 86% 84%, rgba(217, 56, 58, 0.07) 0%, transparent 42%),
        linear-gradient(rgba(229, 184, 75, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(229, 184, 75, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 56px 56px, 56px 56px;
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease;
    }

    /* Static Nautical Compass Rose Watermark */
    .nautical-watermark {
      position: fixed;
      right: -110px;
      bottom: -110px;
      width: 480px;
      height: 480px;
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }

    /* Theater Mode ("Lights Off") */
    body.theater-mode {
      background-color: #020408;
      background-image: none;
    }

    body.theater-mode .top-header {
      opacity: 0.2;
      transition: opacity 0.25s ease;
    }

    body.theater-mode .top-header:hover {
      opacity: 1;
    }

    /* ==========================================================================
       STICKY TOP NAVIGATION HEADER
       ========================================================================== */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.5);
    }

    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-crest {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #1e2f4d, #090f1d);
      border: 1.5px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 18px rgba(229, 184, 75, 0.22);
      flex-shrink: 0;
    }

    .brand-title {
      font-family: var(--font-heading);
      font-size: clamp(1.15rem, 1.9vw, 1.45rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #ffffff 0%, var(--gold-light) 60%, var(--gold-primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Center: Wanted Bounty Plaque + Sailing Ship Progress Wave */
    .grand-line-hud {
      display: flex;
      align-items: center;
      gap: 1.1rem;
      background: rgba(7, 11, 20, 0.72);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 0.4rem 1.1rem 0.4rem 0.55rem;
      flex: 1;
      max-width: 540px;
      min-width: 260px;
    }

    .wanted-plaque {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      background: linear-gradient(135deg, rgba(229, 184, 75, 0.2), rgba(229, 184, 75, 0.05));
      border: 1px solid rgba(229, 184, 75, 0.4);
      border-radius: 999px;
      padding: 0.3rem 0.8rem;
      flex-shrink: 0;
    }

    .wanted-tag {
      font-family: var(--font-heading);
      font-size: 0.64rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--gold-primary);
    }

    .bounty-value {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold-light);
    }

    .voyage-track-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .sea-track {
      flex: 1;
      height: 7px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      position: relative;
      overflow: visible;
    }

    .sea-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--crimson-accent), var(--gold-primary), var(--sea-teal));
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    .ship-marker {
      position: absolute;
      right: -11px;
      top: 50%;
      transform: translateY(-58%);
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85));
    }

    .voyage-count-pill {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--gold-light);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: rgba(21, 34, 56, 0.8);
      color: var(--gold-light);
      border: 1px solid var(--border-subtle);
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-header:hover {
      background: rgba(229, 184, 75, 0.22);
      border-color: var(--gold-primary);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       MAIN 2-COLUMN WORKSPACE
       ========================================================================== */
    .workspace {
      position: relative;
      z-index: 1;
      max-width: 1600px;
      margin: 0 auto;
      padding: 1.35rem 1.5rem 2rem;
      display: grid;
      grid-template-columns: 1fr 370px;
      gap: 1.35rem;
      align-items: start;
    }

    body.theater-mode .workspace {
      grid-template-columns: 1fr;
      max-width: 1360px;
    }

    body.theater-mode .playlist-sidebar {
      display: none;
    }

    /* ==========================================================================
       LEFT COLUMN: THE THEATER STAGE
       ========================================================================== */
    .theater-stage {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      min-width: 0;
    }

    /* Top Episode Banner (Clean & Visual, Not Text Heavy) */
    .episode-banner {
      background: linear-gradient(90deg, rgba(13, 21, 38, 0.95) 0%, rgba(21, 34, 56, 0.85) 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      box-shadow: var(--shadow-elevation);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      position: relative;
      overflow: hidden;
    }

    .episode-banner::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--gold-primary), var(--crimson-accent));
    }

    .banner-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .arc-pill {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--bg-abyss);
      background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .banner-title {
      font-size: clamp(1.1rem, 1.9vw, 1.45rem);
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-gem {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.26rem 0.65rem;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .status-gem.is-completed {
      background: rgba(45, 212, 191, 0.15);
      color: var(--sea-teal);
      border: 1px solid rgba(45, 212, 191, 0.4);
    }

    .status-gem.is-voyage {
      background: rgba(229, 184, 75, 0.12);
      color: var(--gold-light);
      border: 1px solid rgba(229, 184, 75, 0.3);
    }

    /* 16:9 Video Frame Container */
    .player-frame-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #03060c;
      border-radius: 12px;
      border: 1px solid rgba(229, 184, 75, 0.38);
      box-shadow: var(--shadow-elevation);
      overflow: hidden;
    }

    .brass-corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: var(--gold-primary);
      border-style: solid;
      z-index: 3;
      pointer-events: none;
      opacity: 0.75;
    }
    .brass-corner.tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; border-top-left-radius: 4px; }
    .brass-corner.bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; border-bottom-left-radius: 4px; }
    .brass-corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; border-bottom-right-radius: 4px; }

    #player-viewport {
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    #player-viewport iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #070b14;
    }

    /* Top-Right Pop-Out Corner Shield (52px x 52px) */
    .drive-popout-shield {
      width: 52px;
      height: 52px;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 5;
      background: radial-gradient(circle at top right, #152238, rgba(7, 11, 20, 0.92));
      border-bottom-left-radius: 12px;
      border-left: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      cursor: default;
      user-select: none;
    }

    .drive-popout-shield.shield-disabled {
      display: none;
      pointer-events: none;
    }

    /* Animated Log Pose Compass Loading Overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: radial-gradient(circle at center, #101b30 0%, #050811 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .loading-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .compass-spinner {
      width: 72px;
      height: 72px;
      animation: logPoseSpin 2.4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes logPoseSpin {
      0% { transform: rotate(0deg); }
      35% { transform: rotate(195deg); }
      65% { transform: rotate(155deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-title {
      font-family: var(--font-heading);
      color: var(--gold-light);
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Fallback Card */
    .fallback-card {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(229, 184, 75, 0.1) 0%, transparent 65%), var(--bg-navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.75rem;
      gap: 0.75rem;
    }

    .fallback-card h3 {
      font-family: var(--font-heading);
      color: var(--gold-light);
      font-size: 1.2rem;
    }

    /* Control Deck */
    .control-deck {
      background: var(--bg-navy);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.75rem 1.05rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      box-shadow: var(--shadow-elevation);
    }

    .deck-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.42rem;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      background: #1d2f4d;
      border-color: var(--gold-primary);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-crimson {
      background: linear-gradient(135deg, var(--crimson-accent), #a82022);
      border-color: rgba(250, 225, 156, 0.38);
      color: #fff;
    }

    .btn-crimson:hover:not(:disabled) {
      background: linear-gradient(135deg, #ef4345, #c42729);
      border-color: var(--gold-light);
    }

    .btn-watched.is-watched {
      background: rgba(45, 212, 191, 0.16);
      border-color: var(--sea-teal);
      color: var(--sea-teal);
      box-shadow: 0 0 14px rgba(45, 212, 191, 0.2);
    }

    .btn-theater.is-active {
      background: rgba(229, 184, 75, 0.22);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    .popover-wrapper {
      position: relative;
    }

    .subtitles-popover {
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;
      width: 260px;
      background: var(--bg-navy);
      border: 1px solid var(--gold-primary);
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.85);
      z-index: 30;
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: none;
    }

    .subtitles-popover.is-open {
      display: block;
    }

    .subtitles-popover strong {
      color: var(--gold-light);
    }

    /* ==========================================================================
       RIGHT COLUMN: CLEAN "LOG POSE" SIDEBAR (NO SAMPLE EPISODE 1/2/3 CLUTTER)
       ========================================================================== */
    .playlist-sidebar {
      background: var(--bg-navy);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: var(--shadow-elevation);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 0.9rem 1.05rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-title-wrap h2 {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--gold-light);
      letter-spacing: 0.04em;
    }

    .sidebar-filters {
      padding: 0.7rem 0.9rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      background: rgba(7, 11, 20, 0.45);
      border-bottom: 1px solid var(--border-subtle);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 0.65rem;
      color: var(--text-secondary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.8rem;
      padding: 0.48rem 0.65rem 0.48rem 2rem;
    }

    .search-input:focus,
    .arc-select:focus {
      outline: none;
      border-color: var(--gold-primary);
    }

    .arc-select {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.78rem;
      padding: 0.48rem 0.55rem;
      cursor: pointer;
    }

    .episode-list {
      max-height: 600px;
      overflow-y: auto;
      padding: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .episode-list::-webkit-scrollbar {
      width: 6px;
    }
    .episode-list::-webkit-scrollbar-track {
      background: var(--bg-abyss);
    }
    .episode-list::-webkit-scrollbar-thumb {
      background: rgba(229, 184, 75, 0.32);
      border-radius: 999px;
    }

    /* Clean Episode Card: Displays ONLY Your Exact Episode Name + Watched Check */
    .ep-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.7rem 0.85rem;
      border-radius: 9px;
      background: rgba(21, 34, 56, 0.5);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.16s ease, border-color 0.16s ease;
    }

    .ep-card:hover {
      background: var(--bg-surface);
      border-color: var(--border-subtle);
    }

    .ep-card.is-active {
      background: linear-gradient(90deg, rgba(229, 184, 75, 0.16), rgba(21, 34, 56, 0.9));
      border-color: var(--gold-primary);
      box-shadow: 0 0 18px rgba(229, 184, 75, 0.14);
    }

    .ep-card-main {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
      flex: 1;
    }

    .compass-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(229, 184, 75, 0.35);
      flex-shrink: 0;
    }

    .ep-card.is-active .compass-dot {
      background: var(--gold-primary);
      box-shadow: 0 0 8px var(--gold-primary);
    }

    .ep-name-text {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

    .ep-watch-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: rgba(7, 11, 20, 0.55);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .ep-watch-btn:hover {
      border-color: var(--sea-teal);
      color: var(--sea-teal);
    }

    .ep-watch-btn.is-watched {
      background: rgba(45, 212, 191, 0.18);
      border-color: var(--sea-teal);
      color: var(--sea-teal);
    }

    .toast {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      background: var(--bg-navy);
      border: 1px solid var(--gold-primary);
      color: var(--text-primary);
      padding: 0.65rem 1rem;
      border-radius: 10px;
      box-shadow: var(--shadow-elevation);
      font-size: 0.8rem;
      font-weight: 600;
      z-index: 90;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.22s ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1024px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      .grand-line-hud {
        order: 3;
        max-width: 100%;
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        padding: 0.7rem 1rem;
      }
      .workspace {
        padding: 1rem;
      }
      .control-deck {
        flex-direction: column;
        align-items: stretch;

  <script>
    /* ============================================================================
       🏴‍☠️ SARA'S ONE PIECE EPISODE LIST — ADD OR EDIT EPISODES HERE!
       All `driveLink` values are now populated with your exact Google Drive link.
       You can edit any `title` or replace `driveLink` with individual file links anytime!
       ============================================================================ */
    const EPISODES = [
      {
        id: 1,
        title: "I'm Luffy! The Man Who's Gonna Be King of the Pirates!",
        arc: "Romance Dawn Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      },
      {
        id: 2,
        title: "Enter the Great Swordsman! Pirate Hunter Roronoa Zoro!",
        arc: "Romance Dawn Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      },
      {
        id: 3,
        title: "Morgan versus Luffy! Who's the Mysterious Pretty Girl?",
        arc: "Romance Dawn Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      },
      {
        id: 4,
        title: "Luffy's Past! Enter Red-Haired Shanks!",
        arc: "Romance Dawn Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      },
      {
        id: 5,
        title: "A Terrifying Mysterious Power! Captain Buggy, the Clown Pirate!",
        arc: "Orange Town Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      },
      {
        id: 6,
        title: "Desperate Situation! Beast Tamer Mohji vs. Luffy!",
        arc: "Orange Town Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      },
      {
        id: 7,
        title: "Epic Showdown! Swordsman Zoro vs. Acrobat Cabaji!",
        arc: "Orange Town Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      },
      {
        id: 8,
        title: "Who is the Victor? Devil Fruit Power Showdown!",
        arc: "Orange Town Arc",
        driveLink: "https://drive.google.com/drive/folders/1eLjsXD4E37hjhwDhE-QjqiouNQgCXOTL?usp=sharing"
      }
    ];

    /* ============================================================================
       STATE & LOCALSTORAGE
       ============================================================================ */
    const STORAGE_KEYS = {
      WATCHED: "sara_op_watched_v3",
      LAST_EPISODE: "sara_op_last_ep_v3",
      SHIELD_ENABLED: "sara_op_shield_v3"
    };

    const BERRY_PER_EPISODE = 1500000;

    let state = {
      currentEpisodeId: EPISODES[0].id,
      watchedIds: new Set(),
      searchQuery: "",
      selectedArcFilter: "ALL",
      theaterMode: false,
      shieldEnabled: true,
      loadTimeoutId: null
    };

    /* ============================================================================
       1. BULLETPROOF GOOGLE DRIVE URL PARSER (SUPPORTS FILES + FOLDERS)
       ============================================================================ */
    function parseDriveUrl(input) {
      if (!input || typeof input !== "string") return null;
      const trimmed = input.trim();

      if (
        trimmed === "" ||
        trimmed.toUpperCase().includes("PASTE_LINK_HERE") ||
        trimmed.toUpperCase().includes("PASTE_GOOGLE_DRIVE_LINK_HERE")
      ) {
        return null;
      }

      // Support Google Drive Folder Links -> Embedded Folder View
      const folderMatch = trimmed.match(/\/drive\/(?:u\/\d+\/)?folders\/([a-zA-Z0-9_-]{10,})/);
      if (folderMatch && folderMatch[1]) {
        return `https://drive.google.com/embeddedfolderview?id=${folderMatch[1]}#list`;
      }

      // Support Individual Google Drive Video File Links -> /preview Player
      let extractedId = null;

      const fileDMatch = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]{10,})/);
      if (fileDMatch && fileDMatch[1]) {
        extractedId = fileDMatch[1];
      }

      if (!extractedId) {
        const queryIdMatch = trimmed.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
        if (queryIdMatch && queryIdMatch[1]) {
          extractedId = queryIdMatch[1];
        }
      }

      if (!extractedId && /^[a-zA-Z0-9_-]{15,}$/.test(trimmed)) {
        extractedId = trimmed;
      }

      if (!extractedId) return null;
      return `https://drive.google.com/file/d/${extractedId}/preview`;
    }

    /* ============================================================================
       DOM REFERENCES
       ========================================================================== */
    const dom = {
      bountyCounter: document.getElementById("bounty-counter"),
      progressCountText: document.getElementById("progress-count-text"),
      progressFillBar: document.getElementById("progress-fill-bar"),
      btnResumeLast: document.getElementById("btn-resume-last"),

      bannerArcBadge: document.getElementById("banner-arc-badge"),
      bannerEpTitle: document.getElementById("banner-ep-title"),
      bannerStatusBadge: document.getElementById("banner-status-badge"),

      playerViewport: document.getElementById("player-viewport"),
      loadingOverlay: document.getElementById("player-loading-overlay"),
      driveCornerShield: document.getElementById("drive-corner-shield"),

      btnPrevEp: document.getElementById("btn-prev-ep"),
      btnNextEp: document.getElementById("btn-next-ep"),
      btnMarkWatched: document.getElementById("btn-mark-watched"),
      watchedBtnText: document.getElementById("watched-btn-text"),
      btnTheaterMode: document.getElementById("btn-theater-mode"),
      theaterBtnText: document.getElementById("theater-btn-text"),
      btnToggleShield: document.getElementById("btn-toggle-shield"),
      shieldBtnText: document.getElementById("shield-btn-text"),
      btnSubtitlesTip: document.getElementById("btn-subtitles-tip"),
      subtitlesPopover: document.getElementById("subtitles-popover"),

      searchInput: document.getElementById("search-input"),
      arcFilterSelect: document.getElementById("arc-filter-select"),
      episodeListContainer: document.getElementById("episode-list-container"),
      appToast: document.getElementById("app-toast")
    };

    /* ============================================================================
       STORAGE & HELPERS
       ============================================================================ */
    function loadSavedState() {
      try {
        const rawWatched = localStorage.getItem(STORAGE_KEYS.WATCHED);
        if (rawWatched) {
          const parsed = JSON.parse(rawWatched);
          if (Array.isArray(parsed)) state.watchedIds = new Set(parsed);
        }

        const savedEpId = localStorage.getItem(STORAGE_KEYS.LAST_EPISODE);
        if (savedEpId) {
          const numId = Number(savedEpId);
          if (EPISODES.some(e => e.id === numId)) state.currentEpisodeId = numId;
        }

        const savedShield = localStorage.getItem(STORAGE_KEYS.SHIELD_ENABLED);
        if (savedShield !== null) state.shieldEnabled = savedShield === "true";
      } catch (e) {}
    }

    function saveWatchedState() {
      try {
        localStorage.setItem(STORAGE_KEYS.WATCHED, JSON.stringify(Array.from(state.watchedIds)));
      } catch (e) {}
    }

    function saveLastEpisodeState(id) {
      try {
        localStorage.setItem(STORAGE_KEYS.LAST_EPISODE, String(id));
      } catch (e) {}
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    let toastTimer = null;
    function showToast(msg) {
      dom.appToast.textContent = msg;
      dom.appToast.classList.add("is-visible");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        dom.appToast.classList.remove("is-visible");
      }, 2600);
    }

    /* ============================================================================
       MEMORY-SAFE IFRAME LIFECYCLE
       ============================================================================ */
    function destroyActiveIframe() {
      if (state.loadTimeoutId) {
        clearTimeout(state.loadTimeoutId);
        state.loadTimeoutId = null;
      }
      const existingIframe = dom.playerViewport.querySelector("iframe");
      if (existingIframe) {
        existingIframe.onload = null;
        existingIframe.src = "about:blank";
        existingIframe.remove();
      }
      dom.playerViewport.innerHTML = "";
    }

    function mountEpisodePlayer(episode) {
      destroyActiveIframe();

      const embedUrl = parseDriveUrl(episode.driveLink);

      if (!embedUrl) {
        dom.loadingOverlay.classList.remove("is-visible");
        dom.driveCornerShield.classList.add("shield-disabled");
        const fallback = document.createElement("div");
        fallback.className = "fallback-card";
        fallback.innerHTML = `<h3>Log Pose Calibrating — Episode Link Not Added Yet</h3>`;
        dom.playerViewport.appendChild(fallback);
        return;
      }

      updateShieldUI();
      dom.loadingOverlay.classList.add("is-visible");

      const iframe = document.createElement("iframe");
      iframe.setAttribute("allow", "autoplay; fullscreen; picture-in-picture; encrypted-media");
      iframe.setAttribute("allowfullscreen", "true");
      iframe.setAttribute("webkitallowfullscreen", "true");
      iframe.setAttribute("mozallowfullscreen", "true");
      iframe.setAttribute("referrerpolicy", "no-referrer-when-downgrade");
      iframe.setAttribute("frameborder", "0");
      iframe.setAttribute("title", episode.title);

      const hideSpinner = () => {
        dom.loadingOverlay.classList.remove("is-visible");
        if (state.loadTimeoutId) {
          clearTimeout(state.loadTimeoutId);
          state.loadTimeoutId = null;
        }
      };

      iframe.addEventListener("load", hideSpinner, { once: true });
      state.loadTimeoutId = setTimeout(hideSpinner, 6000);

      iframe.src = embedUrl;
      dom.playerViewport.appendChild(iframe);
    }

    /* ============================================================================
       UI RENDERING
       ============================================================================ */
    function populateArcDropdown() {
      const uniqueArcs = Array.from(new Set(EPISODES.map(e => e.arc).filter(Boolean)));
      uniqueArcs.forEach(arc => {
        const opt = document.createElement("option");
        opt.value = arc;
        opt.textContent = arc;
        dom.arcFilterSelect.appendChild(opt);
      });
    }

    function updateHudUI() {
      const total = EPISODES.length;
      const watchedCount = EPISODES.filter(ep => state.watchedIds.has(ep.id)).length;
      const pct = total > 0 ? Math.round((watchedCount / total) * 100) : 0;
      const bounty = watchedCount * BERRY_PER_EPISODE;

      dom.bountyCounter.textContent = bounty.toLocaleString("en-US");
      dom.progressCountText.textContent = `${watchedCount} / ${total}`;
      dom.progressFillBar.style.width = `${pct}%`;
    }

    function updateBannerAndControls(episode) {
      const idx = EPISODES.findIndex(e => e.id === episode.id);
      const isWatched = state.watchedIds.has(episode.id);

      dom.bannerArcBadge.textContent = (episode.arc || "GRAND LINE").toUpperCase();
      dom.bannerEpTitle.textContent = episode.title;

      if (isWatched) {
        dom.bannerStatusBadge.textContent = "✔ COMPLETED";
        dom.bannerStatusBadge.className = "status-gem is-completed";
        dom.btnMarkWatched.classList.add("is-watched");
        dom.watchedBtnText.textContent = "Completed ✔";
      } else {
        dom.bannerStatusBadge.textContent = "⏳ VOYAGE";
        dom.bannerStatusBadge.className = "status-gem is-voyage";
        dom.btnMarkWatched.classList.remove("is-watched");
        dom.watchedBtnText.textContent = "Watched";
      }

      dom.btnPrevEp.disabled = idx <= 0;
      dom.btnNextEp.disabled = idx >= EPISODES.length - 1;
    }

    function updateShieldUI() {
      const currentEp = EPISODES.find(e => e.id === state.currentEpisodeId) || EPISODES[0];
      const embedUrl = parseDriveUrl(currentEp.driveLink);
      // Only cover the top-right corner when playing a direct /preview video
      const isDirectVideo = embedUrl && embedUrl.includes("/preview");

      if (state.shieldEnabled && isDirectVideo) {
        dom.driveCornerShield.classList.remove("shield-disabled");
      } else {
        dom.driveCornerShield.classList.add("shield-disabled");
      }

      dom.shieldBtnText.textContent = state.shieldEnabled ? "Shield: ON" : "Shield: OFF";
    }

    function renderPlaylistSidebar(scrollToActive = false) {
      const q = state.searchQuery.trim().toLowerCase();
      const filter = state.selectedArcFilter;

      dom.episodeListContainer.innerHTML = "";
      let activeCardEl = null;

      EPISODES.forEach(ep => {
        const isWatched = state.watchedIds.has(ep.id);
        const matchesSearch = !q || ep.title.toLowerCase().includes(q);
        if (!matchesSearch) return;

        if (filter === "UNWATCHED" && isWatched) return;
        if (filter !== "ALL" && filter !== "UNWATCHED" && ep.arc !== filter) return;

        const isActive = ep.id === state.currentEpisodeId;
        const card = document.createElement("div");
        card.className = `ep-card${isActive ? " is-active" : ""}`;
        card.setAttribute("role", "listitem");
        card.setAttribute("tabindex", "0");

        // Clean sidebar item: ONLY the episode name + watched toggle button
        card.innerHTML = `
          <div class="ep-card-main">
            <span class="compass-dot"></span>
            <span class="ep-name-text">${escapeHtml(ep.title)}</span>
          </div>
          <button
            type="button"
            class="ep-watch-btn${isWatched ? " is-watched" : ""}"
            title="${isWatched ? "Mark unwatched" : "Mark watched"}"
            aria-label="Toggle watched status for ${escapeHtml(ep.title)}"
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>
        `;

        card.querySelector(".ep-watch-btn").addEventListener("click", e => {
          e.stopPropagation();
          toggleEpisodeWatched(ep.id);
        });

        card.addEventListener("click", () => selectEpisode(ep.id, true));
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectEpisode(ep.id, true);
          }
        });

        if (isActive) activeCardEl = card;
        dom.episodeListContainer.appendChild(card);
      });

      if (scrollToActive && activeCardEl) {
        requestAnimationFrame(() => {
          activeCardEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      }
    }

    /* ============================================================================
       USER ACTIONS & EVENTS
       ============================================================================ */
    function selectEpisode(episodeId, scrollSidebar = true) {
      const targetEp = EPISODES.find(ep => ep.id === episodeId) || EPISODES[0];
      state.currentEpisodeId = targetEp.id;
      saveLastEpisodeState(targetEp.id);

      updateBannerAndControls(targetEp);
      updateHudUI();
      renderPlaylistSidebar(scrollSidebar);
      mountEpisodePlayer(targetEp);
    }

    function toggleEpisodeWatched(episodeId) {
      if (state.watchedIds.has(episodeId)) {
        state.watchedIds.delete(episodeId);
      } else {
        state.watchedIds.add(episodeId);
        showToast("+฿ 1,500,000 Bounty Added!");
      }

      saveWatchedState();
      updateHudUI();

      const currentEp = EPISODES.find(e => e.id === state.currentEpisodeId);
      if (currentEp) updateBannerAndControls(currentEp);
      renderPlaylistSidebar(false);
    }

    function bindEvents() {
      dom.btnPrevEp.addEventListener("click", () => {
        const idx = EPISODES.findIndex(e => e.id === state.currentEpisodeId);
        if (idx > 0) selectEpisode(EPISODES[idx - 1].id, true);
      });

      dom.btnNextEp.addEventListener("click", () => {
        const idx = EPISODES.findIndex(e => e.id === state.currentEpisodeId);
        if (idx >= 0 && idx < EPISODES.length - 1) {
          selectEpisode(EPISODES[idx + 1].id, true);
        }
      });

      dom.btnMarkWatched.addEventListener("click", () => {
        toggleEpisodeWatched(state.currentEpisodeId);
      });

      dom.btnTheaterMode.addEventListener("click", () => {
        state.theaterMode = !state.theaterMode;
        document.body.classList.toggle("theater-mode", state.theaterMode);
        dom.btnTheaterMode.classList.toggle("is-active", state.theaterMode);
        dom.theaterBtnText.textContent = state.theaterMode ? "Lights On" : "Lights Off";
      });

      dom.btnToggleShield.addEventListener("click", () => {
        state.shieldEnabled = !state.shieldEnabled;
        try {
          localStorage.setItem(STORAGE_KEYS.SHIELD_ENABLED, String(state.shieldEnabled));
        } catch (e) {}
        updateShieldUI();
      });

      dom.btnSubtitlesTip.addEventListener("click", e => {
        e.stopPropagation();
        dom.subtitlesPopover.classList.toggle("is-open");
      });

      document.addEventListener("click", e => {
        if (!dom.subtitlesPopover.contains(e.target) && e.target !== dom.btnSubtitlesTip) {
          dom.subtitlesPopover.classList.remove("is-open");
        }
      });

      dom.btnResumeLast.addEventListener("click", () => {
        selectEpisode(state.currentEpisodeId, true);
        document.querySelector(".player-frame-shell").scrollIntoView({ behavior: "smooth", block: "center" });
      });

      dom.searchInput.addEventListener("input", e => {
        state.searchQuery = e.target.value;
        renderPlaylistSidebar(false);
      });

      dom.arcFilterSelect.addEventListener("change", e => {
        state.selectedArcFilter = e.target.value;
        renderPlaylistSidebar(false);
      });
    }

    function initApp() {
      loadSavedState();
      populateArcDropdown();
      bindEvents();
      selectEpisode(state.currentEpisodeId, true);
    }

    initApp();
  </script>
</body>
</html>
